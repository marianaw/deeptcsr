[project]
name = "survan"
version = "0.1.0"
description = "DeepTCSR: temporal-consistency survival regression"
authors = [
    { name = "marianaw", email = "mariana.09.w@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "chex==0.1.86",
    "dm-haiku",
    "h5py==3.10.0",
    "hydra-core==1.3.2",
    "jax==0.4.25",
    "jaxlib==0.4.25",
    "lifelines==0.28.0",
    "matplotlib==3.8.3",
    "numpy==1.26.4",
    "optax==0.2.1",
    "pandas==2.2.1",
    "pyyaml==6.0.1",
    "scikit-learn==1.4.1.post1",
    "scipy==1.12.0",
    "tqdm==4.66.2",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
dm-haiku = { git = "https://github.com/deepmind/dm-haiku", rev = "7324464510e85bc5465dc981291da68e1a66432e" }
